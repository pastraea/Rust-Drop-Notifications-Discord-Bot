name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  windows-uninstall:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test Windows uninstall safeguards and desktop layout
        shell: powershell
        run: .\src\installer\Test-WindowsUninstall.ps1
      - name: Build and test standalone Windows executable
        shell: powershell
        run: .\src\installer\Test-Executable.ps1
      - name: Upload Windows setup executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: artifacts/*.exe
      - name: Test isolated launch-time updates
        shell: powershell
        run: .\src\installer\Test-WindowsUpdate.ps1

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
